# Size budgets for everything a model reads on every request. scripts/check.sh (and CI) fails when a
# file goes over. This is what stops prompts from growing until the kit eats itself (see ADR-0002):
# if a rule doesn't fit, it belongs in a script, not a prompt. Raising a budget is a decision —
# CI flags any PR that changes this file.
#
# glob (relative to the repo root)   max-lines   max-words
global/AGENTS.md                     20          260
global/MAIN.md                       30          420
global/prompts/*.md                  30          320
global/agents/*.md                   45          480
global/skills/*/SKILL.md             45          520
templates/project/AGENTS.md          30          260
templates/project/openspec/config.yaml 40        420
