# pi-config — which model does what
#
# Format:   role=provider/model-id[:thinking]
#   thinking: off | minimal | low | medium | high | xhigh | max   (blank = model default)
#   Command Code's GLM models only accept low | high | max.
# Blank model = inherits the main session's model.
# After editing: commit on a branch, /ship it, merge — pikit deploys it. List IDs: pi --list-models
#
# Plans (each has its own limits, so the load is spread):
#   ChatGPT Plus (tightest)  → spec, debugger, resolver
#   OpenCode Go              → main session, build, researcher
#   Command Code GOAT        → nothing (provider stays installed; e.g. build=commandcode/zai-org/GLM-5.3:high)
# Verification is GitHub Actions now — no model spends tokens on it.

# Main session: you talk to it; it routes /propose, /apply, /fix and does tiny edits itself.
main=opencode-go/glm-5.3:medium

# Writes OpenSpec changes, roadmaps and ADRs.
spec=openai/gpt-6.1-sol:high

# Implements tasks.md, keeps scripts/check.sh green, commits and pushes.
build=opencode-go/glm-5.3:high

# Root-causes failures (local checks, CI logs) and fixes them.
debugger=openai/gpt-6.1-sol:high

# Resolves merge conflicts (headless, automatic: merges into `test`, and main into a branch at /ship).
resolver=openai/gpt-6.1-sol:high

# Web + codebase look-ups, cited briefs.
researcher=opencode-go/deepseek-v4.1-flash:low
