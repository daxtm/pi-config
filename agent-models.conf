# pi-config — which model does what
#
# Format:   role=provider/model-id[:thinking]
#   thinking: off | minimal | low | medium | high | xhigh | max   (blank = model default)
#   Command Code's GLM models only accept low | high | max.
# Blank model = inherits the main session's model.
# After editing: commit on a branch, /ship it, merge — pikit deploys it. List IDs: pi --list-models
#
# Plans (each has its own limits):
#   OpenCode Go   → main, build, researcher. Metered in dollars at list token prices from ONE shared
#                   allowance (5h = 20%, week = 50% of the month), so cheap-per-token models matter.
#                   Agent work is mostly cached input: the cached-input price decides most of the cost.
#   ChatGPT Plus  → spec, debugger, resolver: rare calls that need the strongest model.
#   Command Code  → nothing (provider stays installed; e.g. build=commandcode/zai-org/GLM-5.3:high)
# Verification runs locally through pi-check.
#
# Go prices per 1M tokens (input / output / cached input), Nov 2026:
#   GLM-5.3 1.40 / 4.40 / 0.26 · GLM-5.3-Flash 0.15 / 0.50 / 0.03 · DeepSeek V4.1 Flash 0.15 / 0.60 / 0.003
#   MiMo-V2.6-Pro 0.435 / 0.87 / 0.0036  (next thing to try for build if quality drops)

# Main session: routes /propose, /apply, /fix and does tiny edits. Runs every turn → cheapest.
main=opencode-go/deepseek-v4.1-flash:low

# Writes OpenSpec changes, roadmaps and ADRs. Once per change.
spec=openai/gpt-6.1-sol:medium

# Implements tasks.md, keeps scripts/check.sh green, commits. The heaviest token user.
build=opencode-go/glm-5.3-flash:medium

# Root-causes failures (local checks, CI logs) and fixes them. Only when something fails.
debugger=openai/gpt-6.1-sol:medium

# Confirmed kit defects, isolated from project builds.
repair=openai/gpt-6.1-sol:medium

# Resolves merge conflicts (headless, automatic). Rare and mechanical.
resolver=openai/gpt-6.1-sol:medium

# Web + codebase look-ups, cited briefs.
researcher=opencode-go/deepseek-v4.1-flash:low
